<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="flex:none;height:78px;background:#FAF6F2;border-top:1px solid #E7E2DA;display:grid;grid-template-columns:repeat(5,1fr);align-items:start;padding:11px 8px 0">
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:{{ cExplore }}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M15.4 8.6 13.2 13.2 8.6 15.4 10.8 10.8Z"></path></svg>
    <span style="font:500 10px Poppins,sans-serif;letter-spacing:.03em">Explore</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:{{ cTrip }}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6.5" r="2.2"></circle><circle cx="18" cy="17.5" r="2.2"></circle><path d="M6 8.7v3.1c0 2 1.6 3.2 3.6 3.2h4.8"></path></svg>
    <span style="font:500 10px Poppins,sans-serif;letter-spacing:.03em">My Trip</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:{{ cAdvisors }}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="8.5" r="3.2"></circle><path d="M4 19c0-3 2.5-4.8 5.5-4.8S15 16 15 19"></path><path d="M16 6.4a3 3 0 0 1 0 5.6M17.5 14.6c1.7.6 2.9 2 2.9 4.4"></path></svg>
    <span style="font:500 10px Poppins,sans-serif;letter-spacing:.03em">Advisors</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:{{ cCamera }}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.8h3.4L8 6.2h8l1.6 2.6H21v9.6H3z"></path><circle cx="12" cy="13.4" r="3.3"></circle></svg>
    <span style="font:500 10px Poppins,sans-serif;letter-spacing:.03em">Camera</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:{{ cChat }}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12.6c0 3.4-3.6 6.2-8 6.2-1 0-2-.15-2.9-.42L4 20l1.5-3.3A6.6 6.6 0 0 1 4 12.6c0-3.4 3.6-6.2 8-6.2s8 2.8 8 6.2Z"></path></svg>
    <span style="font:500 10px Poppins,sans-serif;letter-spacing:.03em">Chat</span>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:78},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;explore&quot;,&quot;trip&quot;,&quot;advisors&quot;,&quot;camera&quot;,&quot;chat&quot;,&quot;none&quot;],&quot;default&quot;:&quot;explore&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'explore';
    const on = '#B2543A', off = '#9A8B7E';
    return {
      cExplore: a === 'explore' ? on : off,
      cTrip: a === 'trip' ? on : off,
      cAdvisors: a === 'advisors' ? on : off,
      cCamera: a === 'camera' ? on : off,
      cChat: a === 'chat' ? on : off,
    };
  }
}

</script>
</body>
</html>
